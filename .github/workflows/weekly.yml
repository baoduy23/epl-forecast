name: weekly-forecast

on:
  schedule:
    - cron: "0 6 * * 1"     # Monday 06:00 UTC (13:00 Vietnam), after the weekend round
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      - run: python -m epl_forecast.run --seasons 2425 2526 2627 --current 2627
        env:
          PYTHONPATH: src
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add outputs/ data/matches.csv
          git diff --cached --quiet || git commit -m "forecast: $(date -u +%F)"
          git push
